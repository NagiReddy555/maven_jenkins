name: Meredith Web App
on:
  workflow_dispatch:
env:
  AZURE_WEBAPP_NAME: 'WEBAPP_NAME'
  RESOURCE_GROUP: 'RESOURCE_GROUP'
  BUILD_PACKAGE_NAME: 'webapp.zip'
jobs:
  azure-login-package:
    runs-on: [self-hosted, Linux, x64]
    environment: ppd
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4
      - name: 'Login to Azure'
        uses: wsib-cbia/azure-login@v1 // need to check
        with:
          creds: ${{ secrets.AZURE_RBAC_CREDENTIALS }}
      - name: 'Create Web App Package'
        run: |
          zip -r ${{ env.BUILD_PACKAGE_NAME }} . -x ".git/*" ".github/*" "__pycache__/*" "*.pyc"

  deploy-webapp:
    needs: [azure-login-package]
    runs-on: [self-hosted, Linux, x64]
    environment: ppd
    steps:
      - name: 'Deploy Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.BUILD_PACKAGE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
