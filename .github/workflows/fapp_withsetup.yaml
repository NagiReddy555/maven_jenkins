name: Claim Summary Function App
on:
  workflow_dispatch:
env:
  PYTHON_VERSION: 'some version,Need to ask nataliia'
  AZURE_FUNCTIONAPP_NAME: 'FUNCTION_APP_NAME'
  RESOURCE_GROUP: 'RESOURCE_GROUP'
  FUNCTION_APP_PATH: './func app'
  BUILD_PACKAGE_NAME: 'functionapp.zip'
jobs:
  azure-login:
    runs-on: [self-hosted, Linux, x64]
    environment: ppd
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4
      - name: 'Login to Azure'
        uses: wsib-eai/azure-login@v1
        with:
          creds: ${{ secrets.AZURE_RBAC_CREDENTIALS }}
          
  setup-python:
    needs: [azure-login]
    runs-on: [self-hosted, Linux, x64]
    steps:
      - name: 'Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
  build-az-function:
    needs: [setup-python]
    runs-on: [self-hosted, Linux, x64]
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4
      - name: 'Install Python Dependencies'
        working-directory: './func app'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 'Build Function App Package'
        working-directory: './func app'
        run: |
          zip -r ../${{ env.BUILD_PACKAGE_NAME }} . -x "__pycache__/*" "*.pyc"
  deploy-az-function:
    needs: [build-az-function]
    runs-on: [self-hosted, Linux, x64]
    environment: ppd
    steps:
      - name: 'Deploy Azure Function'
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_FUNCTIONAPP_NAME }}" \
            --src "${{ env.BUILD_PACKAGE_NAME }}"
